<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Focus Flow - Nueva atencion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B4760}a:hover{color:#C2185B}
</style>
</helmet>
<div style="width: 780px; height: 820px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #1C1A27; font-size: 14px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #EEEDF3">
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Nueva atencion</h1>
    <a href="Main.dc.html" aria-label="Cerrar" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
    </a>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 20px">

    <sc-if value="{{desdeIdea}}" hint-placeholder-val="{{false}}">
      <div style="padding: 10px 12px; border-radius: 8px; background: #FFFCF2; border: 1px solid #F1E7C4; font-size: 13px; color: #5C4A12">Creada desde una idea pendiente. Al crearla, la idea queda como convertida.</div>
    </sc-if>

    <fieldset style="border: none; margin: 0; padding: 0">
      <legend style="font-size: 12px; font-weight: 600; color: #3B3850; padding: 0; margin-bottom: 8px">Tipo</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{tipos}}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">
            <span style="{{t.dot}}"></span>{{t.label}}
          </button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <label for="na-tid" style="font-size: 12px; font-weight: 600; color: #3B3850">{{tidLabel}}</label>
        <sc-if value="{{esTicket}}" hint-placeholder-val="{{true}}">
          <input id="na-tid" value="{{tid}}" onInput="{{setTid}}" placeholder="Ej. PTSK0000123" style="height: 44px; min-width: 0; border-radius: 10px; border: 1px solid #D8D5E3; padding: 0 12px; font: 500 14px 'JetBrains Mono', monospace; color: #1C1A27">
        </sc-if>
        <sc-if value="{{noTicket}}" hint-placeholder-val="{{false}}">
          <input id="na-tid" value="{{tidAuto}}" readonly style="height: 44px; min-width: 0; border-radius: 10px; border: 1px solid #EEEDF3; background: #F8F7FB; padding: 0 12px; font: 600 14px 'JetBrains Mono', monospace; color: #4B4760">
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <label for="na-titulo" style="font-size: 12px; font-weight: 600; color: #3B3850">Titulo</label>
        <input id="na-titulo" value="{{titulo}}" onInput="{{setTitulo}}" placeholder="Que hay que hacer" style="height: 44px; min-width: 0; border-radius: 10px; border: 1px solid #D8D5E3; padding: 0 12px; font: 400 14px Inter, sans-serif; color: #1C1A27">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="na-padre" style="font-size: 12px; font-weight: 600; color: #3B3850">Atencion padre <span style="font-weight: 400; color: #6E6A80">(opcional)</span></label>
      <select id="na-padre" value="{{padre}}" onChange="{{setPadre}}" style="height: 44px; border-radius: 10px; border: 1px solid #D8D5E3; padding: 0 10px; font: 400 14px Inter, sans-serif; color: #1C1A27; background: #FFFFFF">
        <option value="">Sin padre</option>
        <option value="PTSK0001234">PTSK0001234 - INFRAS - Despliegue modulo de red Terraform en PRE</option>
        <option value="TLND002998">TLND002998 - NEXHUB - Cargar datos a DynamoDB</option>
        <option value="JINT0000000001">JINT0000000001 - INFRAS - Error en secrets de Flux</option>
      </select>
    </div>

    <sc-if value="{{conPadre}}" hint-placeholder-val="{{false}}">
      <div style="padding: 10px 12px; border-radius: 8px; background: #F3F0FB; border: 1px solid #E2DBF4; font-size: 13px; color: #3E2C78">Hereda proyecto, entornos y HU de <b style="font-family: 'JetBrains Mono', monospace">{{padre}}</b>.</div>
    </sc-if>

    <sc-if value="{{sinPadre}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 28px; padding: 16px; border-radius: 12px; background: #FAFAFC; border: 1px solid #EEEDF3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="na-proj" style="font-size: 12px; font-weight: 600; color: #3B3850">Proyecto</label>
          <input id="na-proj" list="na-proyectos" value="{{proj}}" onInput="{{setProj}}" maxlength="6" placeholder="6 letras" style="width: 130px; height: 40px; box-sizing: border-box; border-radius: 10px; border: 1px solid #D8D5E3; padding: 0 12px; font: 600 14px 'JetBrains Mono', monospace; letter-spacing: 0.06em; color: #1C1A27; background: #FFFFFF">
          <datalist id="na-proyectos">
            <option value="INFRAS"></option>
            <option value="DOCINF"></option>
            <option value="NEXHUB"></option>
            <option value="PROYAA"></option>
          </datalist>
        </div>

        <fieldset style="border: none; margin: 0; padding: 0">
          <legend style="font-size: 12px; font-weight: 600; color: #3B3850; padding: 0; margin-bottom: 6px">Entornos</legend>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{envs}}" as="e" hint-placeholder-count="3">
              <button type="button" onClick="{{e.toggle}}" aria-pressed="{{e.pressed}}" style="{{e.style}}">{{e.name}}</button>
            </sc-for>
          </div>
          <sc-if value="{{envInvalido}}" hint-placeholder-val="{{false}}">
            <span style="display: block; margin-top: 8px; font-size: 12px; color: #B42318">DEV y PRO sin PRE no es una combinacion valida.</span>
          </sc-if>
        </fieldset>

        <fieldset style="border: none; margin: 0; padding: 0">
          <legend style="font-size: 12px; font-weight: 600; color: #3B3850; padding: 0; margin-bottom: 6px">HU</legend>
          <div style="display: inline-flex; padding: 3px; background: #F1EFF7; border-radius: 10px">
            <sc-for list="{{hus}}" as="h" hint-placeholder-count="2">
              <button type="button" onClick="{{h.pick}}" aria-pressed="{{h.pressed}}" style="{{h.style}}">{{h.name}}</button>
            </sc-for>
          </div>
        </fieldset>
      </div>
    </sc-if>

    <sc-if value="{{esTicket}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <label for="na-url" style="font-size: 12px; font-weight: 600; color: #3B3850">URL ServiceNow <span style="font-weight: 400; color: #6E6A80">(opcional)</span></label>
          <input id="na-url" placeholder="https://..." style="height: 44px; border-radius: 10px; border: 1px solid #D8D5E3; padding: 0 12px; font: 400 14px Inter, sans-serif; color: #1C1A27">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <label for="na-ws" style="font-size: 12px; font-weight: 600; color: #3B3850">Area de trabajo Edge <span style="font-weight: 400; color: #6E6A80">(opcional)</span></label>
          <input id="na-ws" value="{{edge}}" placeholder="NUMERO-PROYECTO" style="height: 44px; border-radius: 10px; border: 1px solid #D8D5E3; padding: 0 12px; font: 500 14px 'JetBrains Mono', monospace; color: #1C1A27">
        </div>
      </div>
    </sc-if>

    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5F5B70">{{nota}}</p>
  </div>

  <div style="padding: 14px 24px 18px; border-top: 1px solid #EEEDF3; display: flex; align-items: center; gap: 16px">
    <div style="{{destinoStyle}}">{{destino}}</div>
    <div style="display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0">
      <a href="Main.dc.html" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #E6E4EE; color: #1C1A27; font: 500 14px Inter, sans-serif; display: flex; align-items: center; text-decoration: none">Cancelar</a>
      <sc-if value="{{puedeCrear}}" hint-placeholder-val="{{false}}">
        <a href="Detalle.dc.html" style="height: 44px; padding: 0 22px; border-radius: 10px; background: #C2185B; color: #FFFFFF; font: 600 14px Inter, sans-serif; display: flex; align-items: center; text-decoration: none">Crear</a>
      </sc-if>
      <sc-if value="{{noPuedeCrear}}" hint-placeholder-val="{{true}}">
        <button type="button" disabled title="{{crearTip}}" style="height: 44px; padding: 0 22px; border-radius: 10px; border: none; background: #E6E4EE; color: #6E6A80; font: 600 14px Inter, sans-serif; cursor: not-allowed">Crear</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"desdeIdea":{"editor":"boolean","default":false,"section":"Estado"},"$preview":{"width":780,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tipo: 'ticket', tid: '', titulo: '', padre: '', proj: '', envs: { DEV: false, PRE: false, PRO: false }, hu: 'Semanal', lastIdea: null };
  }
  renderVals() {
    const s = this.state;
    const idea = !!this.props.desdeIdea;
    const titulo = s.lastIdea === idea ? s.titulo : (idea ? 'Terminar el Excel de inventario de API Gateway' : s.titulo);
    const set = (p) => this.setState(Object.assign({ lastIdea: idea, titulo }, p));
    const T = {
      ticket: { label: 'Ticket', bar: '#2F62D6', bg: '#F3F6FF', bd: '#2F62D6', proj: '', next: '' },
      int: { label: 'Iniciativa interna', bar: '#56B7A7', bg: '#F0FAF8', bd: '#2E9C8A', proj: 'INFRAS', next: 'JINT0000000002' },
      doc: { label: 'Documentacion', bar: '#E2A33C', bg: '#FFF8EC', bd: '#C98A1E', proj: 'DOCINF', next: 'JDOC0000000003' },
      con: { label: 'Consulta o Reunion', bar: '#8457E0', bg: '#F6F2FE', bd: '#7446D6', proj: '', next: 'JCON0000000002' }
    };
    const tipos = Object.keys(T).map((k) => {
      const on = s.tipo === k;
      return {
        label: T[k].label, pressed: on ? 'true' : 'false',
        dot: 'width:9px;height:9px;border-radius:50%;flex-shrink:0;background:' + T[k].bar,
        style: 'display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 12px;border-radius:10px;cursor:pointer;color:#1C1A27;font:' + (on ? '600' : '500') + ' 13px/1.25 Inter,sans-serif;text-align:left;' + (on ? 'background:' + T[k].bg + ';border:2px solid ' + T[k].bd : 'background:#FFFFFF;border:1px solid #E6E4EE;margin:1px'),
        pick: () => set({ tipo: k, proj: T[k].proj })
      };
    });
    const envs = ['DEV', 'PRE', 'PRO'].map((n) => {
      const on = !!s.envs[n];
      return {
        name: n, pressed: on ? 'true' : 'false',
        style: 'height:40px;min-width:64px;padding:0 14px;border-radius:10px;cursor:pointer;font:600 13px Inter,sans-serif;' + (on ? 'background:#1C1A27;color:#FFFFFF;border:1px solid #1C1A27' : 'background:#FFFFFF;color:#3B3850;border:1px solid #D8D5E3'),
        toggle: () => set({ envs: Object.assign({}, s.envs, { [n]: !on }) })
      };
    });
    const segOn = 'height:36px;padding:0 16px;border-radius:8px;border:none;background:#FFFFFF;color:#1C1A27;font:600 13px Inter,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(28,26,39,.12)';
    const segOff = 'height:36px;padding:0 16px;border-radius:8px;border:none;background:transparent;color:#4B4760;font:500 13px Inter,sans-serif;cursor:pointer';
    const hus = ['Semanal', 'Independiente'].map((n) => ({ name: n, pressed: s.hu === n ? 'true' : 'false', style: s.hu === n ? segOn : segOff, pick: () => set({ hu: n }) }));

    const esTicket = s.tipo === 'ticket';
    const conPadre = !!s.padre;
    const tidOk = esTicket ? !!s.tid.trim() : true;
    const projOk = conPadre || /^[A-Z]{6}$/.test(s.proj);
    const nEnv = ['DEV', 'PRE', 'PRO'].filter((n) => s.envs[n]).length;
    const envInvalido = !conPadre && s.envs.DEV && s.envs.PRO && !s.envs.PRE;
    const necesitaEnv = (s.tipo === 'ticket' || s.tipo === 'int') && !conPadre;
    const envOk = !necesitaEnv || nEnv > 0;
    const falta = [];
    if (!tidOk) falta.push('Tracking ID');
    if (!projOk) falta.push('proyecto');
    if (!envOk) falta.push('entorno');
    const temporal = falta.length > 0;
    const tituloOk = !!titulo.trim();
    const puedeCrear = tituloOk && !envInvalido;
    const notas = {
      ticket: 'Si ya tienes el numero de ServiceNow, ingresalo ahora; si no, lo completas despues.',
      int: 'El Tracking ID de la Iniciativa interna se asigna automaticamente.',
      doc: 'El Tracking ID de la Documentacion se asigna automaticamente. Si la documentacion es de un ticket, registrala en su bitacora.',
      con: 'El Tracking ID de la Consulta o Reunion se asigna automaticamente. El proyecto puedes asignarlo despues.'
    };
    const edge = esTicket && s.tid.trim() && /^[A-Z]{6}$/.test(s.proj) ? s.tid.trim() + '-' + s.proj : '';
    return {
      desdeIdea: idea, tipos, envs, hus, envInvalido,
      esTicket, noTicket: !esTicket,
      tidLabel: esTicket ? 'Tracking ID · ServiceNow' : 'Tracking ID · automatico',
      tid: s.tid, tidAuto: T[s.tipo].next,
      setTid: (e) => set({ tid: e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g, '') }),
      titulo, setTitulo: (e) => set({ titulo: e.target.value }),
      padre: s.padre, setPadre: (e) => set({ padre: e.target.value }), conPadre, sinPadre: !conPadre,
      proj: s.proj, setProj: (e) => set({ proj: e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6) }),
      edge, nota: notas[s.tipo],
      destino: temporal ? 'Se creara como temporal: falta ' + falta.join(', ') + '. Lo completas despues en el detalle.' : 'Se creara con sus carpetas definitivas.',
      destinoStyle: 'flex:1;min-width:0;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;' + (temporal ? 'background:#FFF6E5;border:1px solid #F1D9A8;color:#5C4410' : 'background:#EEF8F2;border:1px solid #CDEBD8;color:#1A5E36'),
      puedeCrear, noPuedeCrear: !puedeCrear,
      crearTip: !tituloOk ? 'Falta el titulo' : 'Corrige los entornos'
    };
  }
}
</script>
</body>
</html>
